name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\PRK-Companion.csproj

      - name: Publish self-contained app
        shell: pwsh
        run: |
          dotnet publish .\PRK-Companion.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            --output .\publish

      - name: Package release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\package\PRK-Companion | Out-Null
          Copy-Item .\publish\* .\package\PRK-Companion -Recurse
          Copy-Item .\README.md .\package\PRK-Companion
          Compress-Archive -Path .\package\PRK-Companion -DestinationPath .\PRK-Companion-win-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRK-Companion-win-x64
          path: .\PRK-Companion-win-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            .\PRK-Companion-win-x64.zip `
            --title "PRK Companion ${{ github.ref_name }}" `
            --generate-notes
